# Keeps the "Latest from lrbears.com" box current.
# Twice a day it reads the official golf news feeds and saves the newest headlines.
# Only headlines and links are copied; every story opens on lrbears.com.
name: Sync lrbears.com headlines

on:
  schedule:
    - cron: "17 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: headlines
  cancel-in-progress: false

jobs:
  headlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python .github/scripts/fetch_headlines.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save to the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add headlines.json
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Update lrbears.com headlines"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will refresh on its own."
          fi
